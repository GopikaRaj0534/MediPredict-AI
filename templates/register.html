{% extends "base.html" %}
{% block title %}Create account — MediPredict AI{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
{% endblock %}

{% block content %}
<section class="form-page">
  <p class="form-page__eyebrow">Get started</p>
  <h1>Create your free account</h1>
  <p class="form-page__sub">Takes under a minute. No card, no clinic visit.</p>

  <form method="POST" action="{{ url_for('register') }}">
    <div class="field">
      <label for="name">Full name</label>
      <input type="text" id="name" name="name" placeholder="Jordan Lee" required>
    </div>
    <div class="field">
      <label for="email">Email address</label>
      <input type="email" id="email" name="email" placeholder="you@example.com" required>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="At least 8 characters" minlength="8" required>
    </div>
    <button type="submit" class="btn btn--primary btn--full">Create account</button>
  </form>

  <p class="form-page__footer-link">
    Already have an account? <a href="{{ url_for('login') }}">Log in</a>
  </p>
</section>
{% endblock %}
